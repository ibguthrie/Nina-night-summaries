name: Daily YouTube Short Update

on:
  schedule:
    # Runs at 16:30 UTC (8:30 AM PST / 9:30 AM PDT) to safely clear your 8:00 AM PT creation window
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows manual force testing right from the Actions UI window

jobs:
  update-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Clean Media Aligner
        env:
          TZ: 'America/Los_Angeles'
        run: |
          cat << 'EOF' > inline_run.py
          import urllib.request
          import re
          import os
          from datetime import datetime

          # 1. Base Configuration Paths
          HTML_FILE = 'NightSummary/NightSummary.html'
          CHANNEL_ID = 'UCf-B3Rnd2W_vHn2_iRbe_9A'
          FEED_URL = f'https://youtube.com{CHANNEL_ID}'

          if not os.path.exists(HTML_FILE):
              print(f"CRITICAL ERROR: '{HTML_FILE}' missing.")
              exit(0)

          with open(HTML_FILE, 'r', encoding='utf-8') as file:
              content = file.read()

          # Standardize Windows carriage returns to clean line breaks
          content = content.replace('\r\n', '\n')

          # 2. Extract Session Date from N.I.N.A HTML text layout strings
          date_match = re.search(r'\*\*Session Date:\*\*\s*([0-9]{4}-[0-9]{2}-[0-9]{2})', content)
          session_date = date_match.group(1) if date_match else datetime.now().strftime('%Y-%m-%d')
          expected_title = f"Death Valley Observatory Timelapse {session_date}"
          
          # Hardcoded baseline backup ID used if live feeds experience temporary drops
          video_id = "BhRsO0U6-r0" 

          # 3. Pull from YouTube's official feed (immune to layout script blocking)
          try:
              req = urllib.request.Request(FEED_URL, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  xml_data = response.read().decode('utf-8')
                  video_blocks = re.findall(r'<entry>.*?<yt:videoId>([^<]+)</yt:videoId>.*?<title>([^<]+)</title>', xml_data, re.BROADALL if 're' in dir() else re.DOTALL)
                  
                  if video_blocks:
                      for v_id, v_title in video_blocks:
                          if session_date in v_title:
                              video_id = v_id
                              expected_title = v_title
                              print(f"Direct Match Resolved: {v_title} -> {video_id}")
                              break
                      else:
                          video_id = video_blocks
                          expected_title = video_blocks
          except Exception as e:
              print(f"Network stream skipped: {e}. Utilizing backup verification anchor ID.")

          # 4. Generate pure Markdown link card layout block (unblockable by secure web hosts)
          # FIXED PATH STRUCT: Added explicit slashes to guarantee the link paths open successfully
          iframe_markdown = (
              "\n## 🌌 Last Night's All-Sky Timelapse View\n\n"
              f"**[{expected_title}](https://youtube.com{video_id})**\n\n"
          )

          # 5. Target and inject cleanly right beneath your main "# Night Summary Report" banner text
          top_title_pattern = r'(#\s+Night\s+Summary\s+Report)'

          if re.search(top_title_pattern, content, re.IGNORECASE):
              content = re.sub(top_title_pattern, f"\\1\n{iframe_markdown}", content, count=1, flags=re.IGNORECASE)
              print("Success: Video link card embedded cleanly right under the main title report banner.")
          else:
              timeline_pattern = r'(##\s*Session Timeline)'
              if re.search(timeline_pattern, content, re.IGNORECASE):
                  content = re.sub(timeline_pattern, f"{iframe_markdown}\n\\1", content, count=1, flags=re.IGNORECASE)
                  print("Fallback: Video link embedded cleanly above Session Timeline header.")
              else:
                  content += f"\n{iframe_markdown}"

          with open(HTML_FILE, 'w', encoding='utf-8') as file:
              file.write(content)
          EOF
          python inline_run.py

      # 6. Commit stage block with active tracking triggers ([skip ci] instruction string omitted)
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add NightSummary/NightSummary.html
          git commit -m "Automated update: Transformed and embedded active YouTube link block banner" || echo "No changes detected"
          git push
