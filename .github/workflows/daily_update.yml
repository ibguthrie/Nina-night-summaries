name: Daily YouTube Short Update

on:
  schedule:
    # Runs at 16:30 UTC (8:30 AM PST / 9:30 AM PDT) to safely clear your 8:00 AM PT creation window
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows manual force testing right from the Actions UI window

jobs:
  update-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Insert Working Video Frame
        env:
          TZ: 'America/Los_Angeles'
        run: |
          cat << 'EOF' > inline_run.py
          import urllib.request
          import re
          import os
          from datetime import datetime

          # 1. Base Configuration Paths
          HTML_FILE = 'NightSummary/NightSummary.html'
          SHORTS_URL = 'https://youtube.com'

          if not os.path.exists(HTML_FILE):
              print(f"CRITICAL ERROR: '{HTML_FILE}' missing.")
              exit(0)

          with open(HTML_FILE, 'r', encoding='utf-8') as file:
              content = file.read()

          # Standardize Windows carriage returns to clean line breaks
          content = content.replace('\r\n', '\n')

          # 2. Extract Session Date from N.I.N.A HTML text layout string
          date_match = re.search(r'\*\*Session Date:\*\*\s*([0-9]{4}-[0-9]{2}-[0-9]{2})', content)
          session_date = date_match.group(1) if date_match else datetime.now().strftime('%Y-%m-%d')
          expected_title = f"Death Valley Observatory Timelapse {session_date}"
          
          # Verified video fallback ID used if scraping fails
          video_id = "BhRsO0U6-r0" 

          # 3. Pull video ID directly from your public Shorts list layout page (bypasses RSS drops)
          try:
              req = urllib.request.Request(SHORTS_URL, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  page_html = response.read().decode('utf-8')
              
              matches = re.findall(r'"videoId":"([^"]+)","title":\{"runs":\[\{"text":"([^"]+)"\}', page_html)
              if matches:
                  for vid_id, vid_title in matches:
                      if session_date in vid_title or expected_title.lower() in vid_title.lower():
                          video_id = vid_id
                          expected_title = vid_title
                          print(f"Target Video Found: {vid_title} -> {video_id}")
                          break
                  else:
                      # If the explicit date isn't found in a title yet, pull your newest upload
                      video_id = matches[0][0]
                      expected_title = matches[0][1]
                      print(f"Date mismatch. Using newest upload fallback: {expected_title} -> {video_id}")
          except Exception as e:
              print(f"Scraping encountered error: {e}. Utilizing backup verification anchor ID.")

          # 4. Generate the video player using rigid, cross-compatible HTML layout structures
          iframe_markdown = (
              "\n## 🌌 Last Night's All-Sky Timelapse View\n\n"
              "<div align=\"center\" style=\"margin: 25px 0;\">\n"
             f"    <iframe width=\"500\" height=\"500\" src=\"https://youtube.com{video_id}\" title=\"{expected_title}\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen></iframe>\n"
              "</div>\n"
          )

          # 5. Target and inject cleanly right above your Session Timeline section header
          timeline_pattern = r'(##\s*Session Timeline)'

          if re.search(timeline_pattern, content, re.IGNORECASE):
              content = re.sub(timeline_pattern, f"{iframe_markdown}\n\\1", content, count=1, flags=re.IGNORECASE)
              print("Success: Video embedded cleanly right above your Session Timeline header.")
          else:
              content += f"\n{iframe_markdown}"
              print("Warning: Missing layout text elements. Appended video player to page footer.")

          with open(HTML_FILE, 'w', encoding='utf-8') as file:
              file.write(content)
          EOF
          python inline_run.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add NightSummary/NightSummary.html
          git commit -m "Automated update: Embedded latest YouTube Short [skip ci]" || echo "No changes detected"
          git push || echo "Push skipped or unneeded"
