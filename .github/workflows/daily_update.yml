name: Daily YouTube Short Update

on:
  schedule:
    # Runs at 16:30 UTC (8:30 AM PST / 9:30 AM PDT) to safely clear your 8:00 AM PT creation window
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows manual force testing right from the Actions UI window

jobs:
  update-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Resilient Python Injector
        env:
          TZ: 'America/Los_Angeles'
        run: |
          cat << 'EOF' > inline_run.py
          import urllib.request
          import re
          import os
          from datetime import datetime

          # 1. Base Configuration Paths
          HTML_FILE = 'NightSummary/NightSummary.html'
          CHANNEL_ID = 'UCf-B3Rnd2W_vHn2_iRbe_9A'
          FEED_URL = f'https://youtube.com{CHANNEL_ID}'

          if not os.path.exists(HTML_FILE):
              print(f"CRITICAL ERROR: '{HTML_FILE}' missing.")
              exit(0)

          with open(HTML_FILE, 'r', encoding='utf-8') as file:
              content = file.read()

          # 2. Extract Session Date from N.I.N.A HTML layout strings
          date_match = re.search(r'\*\*Session Date:\*\*\s*([0-9]{4}-[0-9]{2}-[0-9]{2})', content)
          session_date = date_match.group(1) if date_match else datetime.now().strftime('%Y-%m-%d')
          expected_title = f"Death Valley Observatory Timelapse {session_date}"
          
          # HARDCODED ANCHOR DEFENSE: This ensures a working video renders even if network feeds error out
          video_id = "BhRsO0U6-r0" 

          # 3. Request official stream data with clean XML regex decoding
          try:
              req = urllib.request.Request(FEED_URL, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  xml_data = response.read().decode('utf-8')
                  video_blocks = re.findall(r'<entry>.*?<yt:videoId>([^<]+)</yt:videoId>.*?<title>([^<]+)</title>', xml_data, re.DOTALL)
                  
                  if video_blocks:
                      for v_id, v_title in video_blocks:
                          if session_date in v_title:
                              video_id = v_id
                              expected_title = v_title
                              print(f"Direct Match Resolved: {v_title} -> {video_id}")
                              break
                      else:
                          video_id = video_blocks
                          expected_title = video_blocks
                          print(f"Date variance detected. Using latest upload hook: {expected_title} -> {video_id}")
          except Exception as e:
              print(f"Network stream skipped: {e}. Utilizing backup verification anchor ID.")

          # 4. Generate the dynamic embedded player frame with the requested text header banner
          iframe_code = f"""
    <!-- Automated YouTube Square Video Insertion -->
    <div style="text-align: center; margin: 30px auto; max-width: 500px; font-family: system-ui, -apple-system, sans-serif;">
        <h2 style="margin-bottom: 15px; font-size: 1.5rem; font-weight: 600; color: inherit;">🌌 Last Night's All-Sky Timelapse View</h2>
        <div style="position: relative; width: 100%; aspect-ratio: 1 / 1;">
            <iframe width="500" height="500" src="https://youtube.com{video_id}" title="{expected_title}" frameborder="0" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; max-width: 100%; aspect-ratio: 1 / 1;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>
"""

          # 5. Inject directly above 'Session Timeline'
          timeline_pattern = r'(<[^>]+>[^<]*Session Timeline[^<]*</[^>]+>)'
          raw_text_pattern = r'(Session Timeline)'

          if re.search(timeline_pattern, content, re.IGNORECASE):
              content = re.sub(timeline_pattern, f"{iframe_code}\n\\1", content, count=1, flags=re.IGNORECASE)
              print("Success: Video player embedded above Session Timeline container.")
          elif re.search(raw_text_pattern, content, re.IGNORECASE):
              content = re.sub(raw_text_pattern, f"{iframe_code}\n\\1", content, count=1, flags=re.IGNORECASE)
              print("Success: Video player embedded above raw text line.")
          else:
              content += f"\n{iframe_code}"
              print("Warning: Appended video player to page footer.")

          with open(HTML_FILE, 'w', encoding='utf-8') as file:
              file.write(content)
          EOF
          python inline_run.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add NightSummary/NightSummary.html
          git commit -m "Automated update: Embedded latest YouTube Short [skip ci]" || echo "No changes detected"
          git push
