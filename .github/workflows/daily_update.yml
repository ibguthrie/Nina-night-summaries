name: Daily YouTube Short Update

on:
  schedule:
    # Runs at 16:30 UTC (8:30 AM PST / 9:30 AM PDT) to safely clear your 8:00 AM PT creation window
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows manual force testing right from the Actions UI window

# Global default permissions setup
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Resilient Media Aligner
        env:
          TZ: 'America/Los_Angeles'
        run: |
          cat << 'EOF' > inline_run.py
          import urllib.request
          import re
          import os
          from datetime import datetime

          HTML_FILE = 'NightSummary/NightSummary.html'
          SHORTS_URL = 'https://youtube.com'

          if not os.path.exists(HTML_FILE):
              print(f"CRITICAL ERROR: '{HTML_FILE}' missing.")
              exit(0)

          with open(HTML_FILE, 'r', encoding='utf-8') as file:
              content = file.read()

          # Convert Windows \r\n to clean standard \n breaks
          content = content.replace('\r\n', '\n')

          # Extract Session Date from N.I.N.A HTML text layout string
          date_match = re.search(r'\*\*Session Date:\*\*\s*([0-9]{4}-[0-9]{2}-[0-9]{2})', content)
          session_date = date_match.group(1) if date_match else datetime.now().strftime('%Y-%m-%d')
          expected_title = f"Death Valley Observatory Timelapse {session_date}"
          
          # Verified video fallback ID
          video_id = "BhRsO0U6-r0" 

          # Pull video ID directly from your public Shorts list layout page
          try:
              req = urllib.request.Request(SHORTS_URL, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  page_html = response.read().decode('utf-8')
              
              matches = re.findall(r'"videoId":"([^"]+)","title":\{"runs":\[\{"text":"([^"]+)"\}', page_html)
              if matches:
                  for vid_id, vid_title in matches:
                      if session_date in vid_title or expected_title.lower() in vid_title.lower():
                          video_id = vid_id
                          expected_title = vid_title
                          print(f"Target Resolved: {vid_title} -> {video_id}")
                          break
                  else:
                      video_id = matches[0][0]
                      expected_title = matches[0][1]
                      print(f"Date variance detected. Using latest upload fallback: {expected_title} -> {video_id}")
          except Exception as e:
              print(f"Scraping encounter error: {e}. Utilizing backup verification anchor ID.")

          # PURE MARKDOWN IMAGE LINK CARD LAYOUT: Completely bypasses HTML iframe blocking
          markdown_card = (
              "\n## 🌌 Last Night's All-Sky Timelapse View\n\n"
              f"[![{expected_title}](https://youtube.com{video_id}/hqdefault.jpg)](https://youtube.com{video_id})\n"
              f"\n*{expected_title} (Click image link above to play video)*\n"
          )

          # PURGE CLEANUP: Strips previous test remnants to keep your layout crisp
          content = re.sub(r'##\s*🌌\s*Last Night\'s All-Sky Timelapse View\s*\n*', '', content, flags=re.IGNORECASE)
          content = re.sub(r'<div align="center".*?</iframe>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
          content = re.sub(r'<iframe width="500".*?</iframe>', '', content, flags=re.IGNORECASE)
          content = re.sub(r'\[Death Valley.*?\]https.*?', '', content, flags=re.IGNORECASE)
          content = re.sub(r'\*Death Valley Observatory.*?\*', '', content, flags=re.IGNORECASE)

          # Target the primary `# Night Summary Report` title block syntax used by N.I.N.A
          top_title_pattern = r'(#\s+Night\s+Summary\s+Report)'

          if re.search(top_title_pattern, content, re.IGNORECASE):
              content = re.sub(top_title_pattern, f"\\1\n{markdown_card}", content, count=1, flags=re.IGNORECASE)
              print("Success: Video link card embedded cleanly at the top of your report.")
          else:
              timeline_pattern = r'(##\s*Session Timeline)'
              if re.search(timeline_pattern, content, re.IGNORECASE):
                  content = re.sub(timeline_pattern, f"{markdown_card}\n\\1", content, count=1, flags=re.IGNORECASE)
                  print("Fallback: Embedded link card above Session Timeline.")
              else:
                  content += f"\n{markdown_card}"

          with open(HTML_FILE, 'w', encoding='utf-8') as file:
              file.write(content)
          EOF
          python inline_run.py

      - name: Save Modified File Back to History Tracking
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add NightSummary/NightSummary.html
          git commit -m "Automated update: Embedded latest YouTube Short [skip ci]" || echo "No changes detected"
          git push || echo "Push skipped or unneeded"

      - name: Setup Pages Settings Environments
        uses: actions/configure-pages@v5

      - name: Compile and Upload Deployment Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-summary:
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build-summary
    steps:
      - name: Force Instant Live Update to GitHub Pages Website URL
        id: deployment
        uses: actions/deploy-pages@v4
