name: Daily YouTube Short Update

on:
  schedule:
    # Runs at 16:30 UTC (8:30 AM PST / 9:30 AM PDT) to safely clear the 8:00 AM PT creation window
    - cron: '30 16 * * *'
  workflow_dispatch: # Lets you trigger it manually anytime via the Actions tab

jobs:
  update-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Explicitly setting the time zone on the GitHub runner ensures Python calculates the "today" string in Pacific Time
      - name: Run Short parser script
        env:
          TZ: 'America/Los_Angeles'
        run: python update_short.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add NightSummary.html
          git commit -m "Automated update: Embedded latest YouTube Short [skip ci]" || echo "No changes detected"
          git push
