name: Daily YouTube Short Update

on:
  schedule:
    # Runs everyday at 8:30 AM UTC
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows you to force run it manually whenever you want

jobs:
  update-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Get code from your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      # Step 3: Execute the script to modify the HTML file
      - name: Run Short parser script
        run: python update_short.py

      # Step 4: Commit adjustments back into the repository
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add NightSummary.html
          git commit -m "Automated update: Embedded latest YouTube Short [skip ci]" || echo "No changes detected"
          git push
