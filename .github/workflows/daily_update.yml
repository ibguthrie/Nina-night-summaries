name: Daily YouTube Short Update

on:
  schedule:
    # Runs at 16:30 UTC (8:30 AM PST / 9:30 AM PDT) to safely clear your 8:00 AM PT creation window
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows manual force testing right from the Actions UI window

jobs:
  update-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Standard external run call removes script block freezes completely
      - name: Execute Clean Media Injector
        shell: python
        run: |
          import urllib.request
          import re
          import os
          from datetime import datetime

          # 1. Base Configuration Paths (YOUR WORKING FEED SYSTEM VERBATIM)
          HTML_FILE = 'NightSummary/NightSummary.html'
          CHANNEL_ID = 'UCf-B3Rnd2W_vHn2_iRbe_9A'
          FEED_URL = f'https://youtube.com{CHANNEL_ID}'

          if not os.path.exists(HTML_FILE):
              print(f"CRITICAL ERROR: '{HTML_FILE}' missing.")
              exit(0)

          with open(HTML_FILE, 'r', encoding='utf-8') as file:
              content = file.read()

          # Standardize Windows carriage returns to clean line breaks
          content = content.replace('\r\n', '\n')

          # 2. Extract Session Date from N.I.N.A HTML text layout metadata strings
          date_match = re.search(r'\*\*Session Date:\*\*\s*([0-9]{4}-[0-9]{2}-[0-9]{2})', content)
          session_date = date_match.group(1) if date_match else datetime.now().strftime('%Y-%m-%d')
          expected_title = f"Death Valley Observatory Timelapse {session_date}"
          
          # Hardcoded baseline backup ID used if live feeds experience temporary drops
          video_id = "BhRsO0U6-r0" 

          # 3. Pull from YouTube's official feed (YOUR WORKING DISCOVERY SYSTEM VERBATIM)
          try:
              req = urllib.request.Request(FEED_URL, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  xml_data = response.read().decode('utf-8')
                  video_blocks = re.findall(r'<entry>.*?<yt:videoId>([^<]+)</yt:videoId>.*?<title>([^<]+)</title>', xml_data, re.DOTALL)
                  
                  if video_blocks:
                      for v_id, v_title in video_blocks:
                          if session_date in v_title:
                              video_id = v_id
                              expected_title = v_title
                              print(f"Direct Match Resolved: {v_title} -> {video_id}")
                              break
                      else:
                          video_id = video_blocks
                          expected_title = video_blocks
                          print(f"Date variance detected. Using latest upload hook: {expected_title} -> {video_id}")
          except Exception as e:
              print(f"Network stream skipped: {e}. Utilizing backup verification anchor ID.")

          # 4. Generate the video player using rigid structures (YOUR WORKING PLAYER VERBATIM)
          iframe_markdown = (
              "\n## 🌌 Last Night's All-Sky Timelapse View\n\n"
              "<div align=\"center\" style=\"margin: 25px 0;\">\n"
             f"    <iframe width=\"500\" height=\"500\" src=\"https://youtube.com{video_id}\" title=\"{expected_title}\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen></iframe>\n"
              "</div>\n"
          )

          # 5. PURGE PREVIOUS INJECTIONS: Erases duplicate stray banners or frames from previous test runs
          content = re.sub(r'##\s*🌌\s*Last Night\'s All-Sky Timelapse View\s*\n*', '', content, flags=re.IGNORECASE)
          content = re.sub(r'<div align="center".*?</iframe>.*?</div>', '', content, flags=re.DOTALL | re.IGNORECASE)
          content = re.sub(r'<iframe width="500".*?</iframe>', '', content, flags=re.IGNORECASE)

          # 6. BROAD LAYOUT POSITION FIX: Matches the timeline segment regardless of HTML tags, formatting, or trailing text spaces
          timeline_pattern = r'([^\n]*Session\s+Timeline[^\n]*)'

          if re.search(timeline_pattern, content, re.IGNORECASE):
              content = re.sub(timeline_pattern, f"{iframe_markdown}\n\\1", content, count=1, flags=re.IGNORECASE)
              print("Success: Video embedded cleanly right above your Session Timeline segment.")
          else:
              content += f"\n{iframe_markdown}"
              print("Warning: Missing all layout target headers. Appended video player to page footer.")

          with open(HTML_FILE, 'w', encoding='utf-8') as file:
              file.write(content)

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add NightSummary/NightSummary.html
          git commit -m "Automated update: Fixed link parameters and embedded active video player frame" || echo "No changes detected"
          git push
