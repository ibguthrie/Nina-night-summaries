name: Daily HTML Update

on:
  schedule:
    # This cron schedule runs every day at 12:00 AM UTC
    - cron: '30 8 * * *'
  workflow_dispatch: # Allows you to also trigger it manually from the GitHub UI

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to allow the action to push changes back to the repo

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Make changes to the HTML file
      # This example uses basic bash 'sed' to replace a placeholder text with the current date
      - name: Modify HTML file
        run: |
          sed -i "s/LAST_UPDATED_PLACEHOLDER/$(date)/g" NightSummary.html

      # Step 3: Commit and push the changes back to GitHub
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automated daily HTML update [skip ci]" || echo "No changes to commit"
          git push
